<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Content Machine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;1,400&display=swap');
  :root {
    --bg: #0e0e0e; --surface: #161616; --border: #2a2a2a;
    --accent: #e8c547; --accent2: #ff6b35; --text: #e8e8e0;
    --muted: #666; --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Lora', Georgia, serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); flex-shrink: 0; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: 0.04em; color: var(--accent); text-transform: uppercase; }
  .logo span { color: var(--text); font-weight: 400; }
  .badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; background: var(--border); padding: 3px 8px; border-radius: 2px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
  .left { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: var(--surface); flex-shrink: 0; }
  .panel-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; color: var(--text); font-family: 'Lora', Georgia, serif; font-size: 0.92rem; line-height: 1.8; padding: 20px; caret-color: var(--accent); }
  textarea::placeholder { color: var(--muted); font-style: italic; }
  .char-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--muted); padding: 6px 20px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .formats-section { border-top: 1px solid var(--border); padding: 16px 20px; background: var(--surface); flex-shrink: 0; }
  .formats-title { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .formats-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .format-chip { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--muted); cursor: pointer; transition: all 0.15s; user-select: none; background: transparent; }
  .format-chip:hover { border-color: var(--accent); color: var(--accent); }
  .format-chip.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 500; }
  .generate-btn { width: 100%; padding: 13px; background: var(--accent); border: none; color: #000; font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; border-radius: 2px; }
  .generate-btn:hover:not(:disabled) { background: #f0d060; transform: translateY(-1px); }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .right { display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--surface); scrollbar-width: none; flex-shrink: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 12px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); cursor: pointer; border-right: 1px solid var(--border); white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.15s; flex-shrink: 0; background: transparent; border-top: none; border-left: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: var(--bg); }
  .output-area { flex: 1; overflow-y: auto; padding: 24px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .placeholder-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); text-align: center; }
  .placeholder-icon { font-size: 2.5rem; opacity: 0.3; }
  .placeholder-text { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .output-content { display: none; flex-direction: column; gap: 24px; }
  .output-content.visible { display: flex; }
  .content-card { border: 1px solid var(--border); border-radius: 3px; overflow: hidden; animation: fadeSlide 0.3s ease; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .card-header { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
  .copy-btn { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); background: transparent; border: 1px solid var(--border); padding: 3px 8px; cursor: pointer; border-radius: 2px; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.06em; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { color: var(--success); border-color: var(--success); }
  .card-body { padding: 16px; font-size: 0.9rem; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
  .loading-card { border: 1px solid var(--border); border-radius: 3px; padding: 20px 16px; display: flex; align-items: center; gap: 12px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .error-card { border: 1px solid #ff6b35; border-radius: 3px; padding: 16px; background: rgba(255,107,53,0.05); font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div class="logo">Content<span>Machine</span></div>
  <div class="badge">Powered by Claude</div>
</header>
<div class="main">
  <div class="left">
    <div class="panel-header"><div class="dot"></div><span class="panel-label">Interview / Script Input</span></div>
    <textarea id="transcript" placeholder="Paste your interview transcript, podcast script, or any raw text here..."></textarea>
    <div class="char-count" id="charCount">0 characters</div>
    <div class="formats-section">
      <div class="formats-title">Select output formats</div>
      <div class="formats-grid" id="formatsGrid"></div>
      <button class="generate-btn" id="generateBtn" onclick="generate()">⚡ Generate Content</button>
    </div>
  </div>
  <div class="right">
    <div class="tabs" id="tabsBar">
      <button class="tab active" onclick="switchTab('all', this)">All</button>
    </div>
    <div class="output-area">
      <div class="placeholder-state" id="placeholder">
        <div class="placeholder-icon">◈</div>
        <div class="placeholder-text">Outputs will appear here</div>
        <div style="font-size:0.78rem;color:var(--muted);max-width:220px;font-style:italic;">Select formats, paste transcript, hit generate</div>
      </div>
      <div class="output-content" id="outputContent"></div>
    </div>
  </div>
</div>
<script>
const FORMATS = [
  { id: 'linkedin',   label: 'LinkedIn Post',    icon: '💼' },
  { id: 'twitter',    label: 'X Thread',          icon: '🐦' },
  { id: 'newsletter', label: 'Newsletter',        icon: '📧' },
  { id: 'quotes',     label: 'Pull Quotes',       icon: '❝'  },
  { id: 'blog',       label: 'Blog Post',         icon: '📝' },
  { id: 'summary',    label: 'Key Takeaways',     icon: '✅' },
  { id: 'hooks',      label: 'Hooks / Headlines', icon: '🎯' },
  { id: 'shorts',     label: 'Short-form Clips',  icon: '🎬' },
];
const FORMAT_PROMPTS = {
  linkedin:   `Write a compelling LinkedIn post based on this transcript. 150-200 words. Start with a strong hook (no "I" as first word), share 1 key insight, end with a question or CTA. Use line breaks for readability. No hashtags.`,
  twitter:    `Write a Twitter/X thread based on this transcript. 5-7 tweets. Tweet 1 is the hook. Each tweet under 280 chars. Number them 1/, 2/, etc. Make each tweet standalone-worthy.`,
  newsletter: `Write a newsletter section based on this transcript. Include: a punchy subject line, 2-3 paragraphs of insight, and a "this week's takeaway" callout box (in brackets). Conversational but smart tone.`,
  quotes:     `Extract 4-5 of the most powerful, shareable quotes from this transcript. Format each as: "Quote here" — [context/speaker label]. Choose quotes that work standalone on social media.`,
  blog:       `Write a full blog post based on this transcript. Include: SEO-friendly title, intro paragraph, 3-4 H2 sections with content, and a conclusion. ~600 words. Informative and engaging.`,
  summary:    `Extract the 5-7 key takeaways from this transcript. Format as a numbered list. Each point 1-2 sentences, actionable or insightful, and standalone.`,
  hooks:      `Write 6 attention-grabbing hooks or headlines based on this transcript. Mix formats: questions, bold statements, "how to" angles, contrarian takes, curiosity gaps. Label each with its type.`,
  shorts:     `Identify 3-4 moments from this transcript that would make great short-form video clips (TikTok/Reels/Shorts). For each: timestamp context, key quote/moment, and why it works for short-form.`,
};

let activeFormats = new Set(['linkedin', 'twitter', 'summary']);
let currentTab = 'all';
let results = {};

const grid = document.getElementById('formatsGrid');
FORMATS.forEach(f => {
  const chip = document.createElement('button');
  chip.className = 'format-chip' + (activeFormats.has(f.id) ? ' active' : '');
  chip.innerHTML = `${f.icon} ${f.label}`;
  chip.onclick = () => {
    if (activeFormats.has(f.id)) { activeFormats.delete(f.id); chip.classList.remove('active'); }
    else { activeFormats.add(f.id); chip.classList.add('active'); }
  };
  grid.appendChild(chip);
});

document.getElementById('transcript').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length.toLocaleString() + ' characters';
});

function switchTab(id, el) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderResults();
}

function renderResults() {
  const container = document.getElementById('outputContent');
  container.innerHTML = '';
  const toShow = currentTab === 'all' ? Object.entries(results) : [[currentTab, results[currentTab]]];
  toShow.forEach(([id, data]) => {
    if (!data) return;
    const fmt = FORMATS.find(f => f.id === id);
    const card = document.createElement('div');
    if (data.loading) {
      card.className = 'loading-card';
      card.innerHTML = `<div class="spinner"></div><div class="loading-label">Generating ${fmt?.label}...</div>`;
    } else if (data.error) {
      card.className = 'error-card';
      card.textContent = '⚠ ' + data.error;
    } else {
      card.className = 'content-card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-title">${fmt?.icon} ${fmt?.label}</span>
          <button class="copy-btn" onclick="copyCard(this,'${id}')">Copy</button>
        </div>
        <div class="card-body">${escapeHtml(data.text)}</div>`;
    }
    container.appendChild(card);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyCard(btn, id) {
  const text = results[id]?.text;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

async function generate() {
  const transcript = document.getElementById('transcript').value.trim();
  if (!transcript) { alert('Please paste a transcript first.'); return; }
  if (activeFormats.size === 0) { alert('Select at least one format.'); return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.textContent = 'Generating...';
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('outputContent').classList.add('visible');

  const tabsBar = document.getElementById('tabsBar');
  tabsBar.innerHTML = `<button class="tab active" onclick="switchTab('all', this)">All</button>`;
  results = {};

  activeFormats.forEach(id => {
    const fmt = FORMATS.find(f => f.id === id);
    const tab = document.createElement('button');
    tab.className = 'tab'; tab.textContent = fmt?.label;
    tab.onclick = function() { switchTab(id, this); };
    tabsBar.appendChild(tab);
    results[id] = { loading: true };
  });
  renderResults();

  const promises = [...activeFormats].map(async (id) => {
    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: `${FORMAT_PROMPTS[id]}\n\n---TRANSCRIPT---\n${transcript}`
        })
      });
      const data = await res.json();
      if (data.error) { results[id] = { error: data.error }; }
      else { results[id] = { text: data.text }; }
    } catch (err) {
      results[id] = { error: err.message };
    }
    renderResults();
  });

  await Promise.all(promises);
  btn.disabled = false; btn.textContent = '⚡ Generate Content';
}
</script>
</body>
</html>
